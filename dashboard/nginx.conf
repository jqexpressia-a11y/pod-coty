server {
    listen 80;
    server_name podcitydash-fggmawsh.manus.space;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name podcitydash-fggmawsh.manus.space;

    ssl_certificate     /etc/letsencrypt/live/podcitydash-fggmawsh.manus.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/podcitydash-fggmawsh.manus.space/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;

    # Next.js static assets — long cache
    location /_next/static/ {
        proxy_pass http://dashboard:3000;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SSE streaming — disable buffering
    location /api/claude/ {
        proxy_pass http://dashboard:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
    }

    # Everything else
    location / {
        proxy_pass http://dashboard:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
